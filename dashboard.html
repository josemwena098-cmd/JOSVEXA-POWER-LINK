<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JOSVEXA Power Link — Dashboard</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a href="dashboard.html" class="brand">JOSVEXA <span>POWER LINK</span></a><div><span id="userName" class="muted"></span><button id="logoutBtn" class="btn danger">Logout</button></div></header><main class="wrap"><section class="welcome"><div><p class="eyebrow">USER DASHBOARD</p><h1>Welcome, <span id="welcomeName">User</span></h1><p class="muted">Create a link, share it, and let the visitor decide what to allow.</p></div><button id="newLinkBtn" class="btn primary">🚀 Create Power Link</button></section><section class="stats"><div><small>POWER LINKS</small><strong id="linkCount">0</strong></div><div><small>ACTIVE</small><strong id="activeCount">0</strong></div><div><small>SESSIONS</small><strong>0</strong></div></section><section class="panel"><p class="eyebrow">MY LINKS</p><h2>Your Power Links</h2><div id="linksList" class="links-list"><p class="muted">No Power Links yet.</p></div></section><section id="generator" class="panel hidden"><p class="eyebrow">LINK GENERATOR</p><h2>Create a new Power Link</h2><form id="powerLinkForm"><label>Link title</label><input id="linkTitle" placeholder="JOSVEXA PICHA" required><label>Description</label><textarea id="description" rows="3" placeholder="Tell the visitor what this link requests."></textarea><label>Features</label><div class="feature-options"><label class="check"><input type="checkbox" name="feature" value="camera">📷 Camera Capture</label><label class="check"><input type="checkbox" name="feature" value="audio">🎙️ Audio Record</label><label class="check"><input type="checkbox" name="feature" value="video">🎥 Video Record</label><label class="check"><input type="checkbox" name="feature" value="location">📍 GPS Location</label></div><div class="two"><div><label>Photo limit</label><input id="photoLimit" type="number" min="1" max="100" value="1"></div><div><label>Duration seconds</label><input id="duration" type="number" min="1" max="300" value="30"></div></div><label>Redirect URL (optional)</label><input id="redirectUrl" type="url" placeholder="https://example.com"><button class="btn primary full">🚀 Generate Power Link</button><p id="generatorMessage" class="message"></p></form></section></main><script type="module" src="script.js"></script></body></html>
