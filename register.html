<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JOSVEXA Power Link — Register</title><link rel="stylesheet" href="style.css"></head><body><div class="bg-orb orb1"></div><div class="bg-orb orb2"></div><main class="auth-wrap"><section class="auth-card wide"><div class="brand"><span class="brand-mark">J</span><div><b>JOSVEXA</b><small>POWER LINK</small></div></div><h1>Create account</h1><p class="muted">Your name and phone are required before using the dashboard.</p><form id="registerForm" class="form"><label>Full name<input id="name" type="text" required autocomplete="name"></label><label>Phone number<input id="phone" type="tel" required placeholder="+255..." autocomplete="tel"></label><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Password<input id="password" type="password" minlength="6" required autocomplete="new-password"></label><button class="btn primary" type="submit">Create Account</button></form><button id="googleBtn" class="btn google">Continue with Google</button><p id="message" class="message"></p><p class="switch">Already have an account? <a href="index.html">Login</a></p></section></main><script type="module" src="script.js"></script></body></html>
